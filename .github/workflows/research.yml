name: Grid Optimizer Research

on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days"
        required: false
        default: "270"
      interval:
        description: "Binance candle interval"
        required: false
        default: "1m"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Validate configuration
        run: python -m json.tool config/baseline_9161957.json >/dev/null && python -m json.tool config/experiments.json >/dev/null
      - name: Run Binance-style audit
        run: |
          sed -i "s#https://api.binance.com/api/v3/klines#https://data-api.binance.vision/api/v3/klines#" research/grid_backtest.py
          python research/grid_backtest.py --days "${{ inputs.days || '270' }}" --interval "${{ inputs.interval || '1m' }}"
      - name: Publish audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/binance_style_audit.csv
          git diff --cached --quiet || git commit -m "results: Binance-style grid audit"
          git push
