name: Grid Optimizer Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in ["config/baseline_9161957.json", "config/experiments.json"]:
              json.loads(Path(p).read_text())
              print(f"OK: {p}")
          PY

      - name: Show research plan
        run: |
          echo "Baseline: bot 9161957"
          echo "Research mode: controlled parameter experiments"
          echo "Live trading: DISABLED"
