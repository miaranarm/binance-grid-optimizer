name: Grid Optimizer Research

on:
  push:
    paths-ignore:
      - "results/**"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days"
        required: false
        default: "90"
      interval:
        description: "Binance candle interval"
        required: false
        default: "5m"

concurrency:
  group: grid-optimizer-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Validate configuration
        run: python -m json.tool config/baseline_9161957.json >/dev/null && python -m json.tool config/experiments.json >/dev/null
      - name: Run Binance-style audit
        run: |
          sed -i "s#https://api.binance.com/api/v3/klines#https://data-api.binance.vision/api/v3/klines#" research/grid_backtest.py
          python research/grid_backtest.py --days "${{ inputs.days || '90' }}" --interval "${{ inputs.interval || '5m' }}"
      - name: Publish audit results
        run: |
          cp results/binance_style_audit.csv /tmp/binance_style_audit.csv
          cp results/grid_optimizer_ranked.csv /tmp/grid_optimizer_ranked.csv
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp /tmp/binance_style_audit.csv results/binance_style_audit.csv
          cp /tmp/grid_optimizer_ranked.csv results/grid_optimizer_ranked.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/binance_style_audit.csv results/grid_optimizer_ranked.csv
          git diff --cached --quiet || git commit -m "results: systematic grid optimizer ranking"
          git push
