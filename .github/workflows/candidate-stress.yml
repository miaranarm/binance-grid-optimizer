name: Candidate Grid Stress Validation
on:
  push:
    paths:
      - "config/candidate_grid_risk_v1.json"
      - "research/regime_validation.py"
      - "research/candidate_stress.py"
      - ".github/workflows/candidate-stress.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: |
          sed -i "s#https://api.binance.com/api/v3/klines#https://data-api.binance.vision/api/v3/klines#" research/regime_validation.py
          python research/candidate_stress.py --days 270
      - run: |
          cp results/candidate_stress.csv /tmp/candidate_stress.csv
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp /tmp/candidate_stress.csv results/candidate_stress.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/candidate_stress.csv
          git diff --cached --quiet || git commit -m "results: candidate stress validation"
          git push
