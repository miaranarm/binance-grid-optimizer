name: Grid Optimizer Long Validation

on:
  push:
    paths:
      - "research/long_validation.py"
      - ".github/workflows/long-validation.yml"
      - "research/grid_backtest.py"
      - "config/baseline_9161957.json"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days"
        required: false
        default: "270"
      interval:
        description: "Binance candle interval"
        required: false
        default: "5m"

permissions:
  contents: write

concurrency:
  group: grid-optimizer-long-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas requests
      - name: Validate configuration
        run: python -m json.tool config/baseline_9161957.json >/dev/null
      - name: Run long-horizon validation
        run: |
          sed -i "s#https://api.binance.com/api/v3/klines#https://data-api.binance.vision/api/v3/klines#" research/grid_backtest.py
          python research/long_validation.py --days "${{ inputs.days || '270' }}" --interval "${{ inputs.interval || '5m' }}"
      - name: Publish validation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp results/long_validation.csv /tmp/long_validation.csv
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp /tmp/long_validation.csv results/long_validation.csv
          git add results/long_validation.csv
          git diff --cached --quiet || git commit -m "results: long-horizon grid validation"
          git push
